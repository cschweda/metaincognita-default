<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- metaincognita social card, Swiss (v3): the page's own system at 1200×630.
       Ink ground, 64px margins on a 12-column grid, hairline rules, one grotesque, and
       the single accent (signal green) on "Given away.". Plain text, no filters, so
       librsvg (rsvg-convert) renders it as drawn. Re-render:
       rsvg-convert -w 1200 -h 630 public/og-image.svg -o public/og-image.png -->
  <rect width="1200" height="630" fill="#111111"/>

  <g font-family="'Helvetica Neue', Helvetica, 'Inter Tight', Arial, sans-serif">
    <!-- top bar -->
    <text x="64" y="84" font-size="28" font-weight="700" letter-spacing="-0.5" fill="#f2f2f0">metaincognita</text>
    <text x="1136" y="84" font-size="20" fill="#a3a3a3" text-anchor="end">metaincognita.com</text>
    <rect x="64" y="112" width="1072" height="1" fill="#2e2e2e"/>

    <!-- the thesis -->
    <text x="60" y="246" font-size="96" font-weight="700" letter-spacing="-4" fill="#f2f2f0">Built out of curiosity.</text>
    <text x="60" y="340" font-size="96" font-weight="700" letter-spacing="-4" fill="#5aa67d">Given away.</text>

    <!-- the index: six rooms, in floor order -->
    <rect x="64" y="438" width="1072" height="2" fill="#f2f2f0"/>
    <g font-size="15">
      <text x="64" y="470" fill="#a3a3a3">01</text>
      <text x="64" y="496" font-size="16" font-weight="700" fill="#f2f2f0">The Workshop</text>
      <text x="64" y="519" fill="#a3a3a3">14 tools</text>

      <text x="246" y="470" fill="#a3a3a3">02</text>
      <text x="246" y="496" font-size="16" font-weight="700" fill="#f2f2f0">VogelTronics</text>
      <text x="246" y="519" fill="#a3a3a3">3 exhibits</text>

      <text x="428" y="470" fill="#a3a3a3">03</text>
      <text x="428" y="496" font-size="16" font-weight="700" fill="#f2f2f0">Casino Table Games</text>
      <text x="428" y="519" fill="#a3a3a3">4 tables</text>

      <text x="610" y="470" fill="#a3a3a3">04</text>
      <text x="610" y="496" font-size="16" font-weight="700" fill="#f2f2f0">Casino Machines</text>
      <text x="610" y="519" fill="#a3a3a3">4 machines</text>

      <text x="792" y="470" fill="#a3a3a3">05</text>
      <text x="792" y="496" font-size="16" font-weight="700" fill="#f2f2f0">Interactive Fiction</text>
      <text x="792" y="519" fill="#a3a3a3">1 suite</text>

      <text x="974" y="470" fill="#a3a3a3">06</text>
      <text x="974" y="496" font-size="16" font-weight="700" fill="#f2f2f0">Retro Games</text>
      <text x="974" y="519" fill="#a3a3a3">1 game</text>
    </g>
    <rect x="64" y="546" width="1072" height="1" fill="#2e2e2e"/>

    <!-- the footing -->
    <text x="64" y="586" font-size="17" fill="#a3a3a3">27 open-source projects. Free. No sign-ups.</text>
  </g>
</svg>
